version: 2

updates:
  # Runtime and build dependencies. Grouped so a week of patch bumps arrives as
  # one pull request instead of fifteen.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
      production-dependencies:
        dependency-type: production
        update-types:
          - minor
          - patch
    ignore:
      # electron-vite, vite, and the React plugin move together; bumping one
      # alone produces peer conflicts that are not worth reviewing.
      - dependency-name: vite
        update-types:
          - version-update:semver-major
      - dependency-name: electron-vite
        update-types:
          - version-update:semver-major
      # @vitejs/plugin-react 6 requires vite 8 plus additional peers, so a major
      # bump only works after the Vite migration above. See PR #18.
      - dependency-name: '@vitejs/plugin-react'
        update-types:
          - version-update:semver-major
      # electron-store 9 and later are ESM-only. The main process is bundled as
      # CommonJS with runtime dependencies externalized, so requiring them throws
      # "Store is not a constructor" at startup. See PR #17.
      - dependency-name: electron-store
        update-types:
          - version-update:semver-major
      # Electron is pinned deliberately to a Castlabs ECS build with Widevine.
      # A registry-major bump would break DRM playback, so it is a manual
      # decision made by changing the pinned GitHub tag.
      - dependency-name: electron

  # Keep the workflow actions themselves current. These are easy to let rot and
  # they run with repository credentials.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns:
          - '*'
