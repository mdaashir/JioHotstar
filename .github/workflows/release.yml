name: release

# Releases are cut by pushing a tag, not by merging. Merging is routine; a tag is
# a deliberate act, and it is the only thing that should publish an installer.
#
#   git tag v0.2.0
#   git push origin v0.2.0
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Gate every release on the same checks a pull request gets, including e2e.
  # `npm run verify` never launches the app, so on its own it would happily pass
  # a commit whose window opens but cannot play.
  gate:
    name: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Cache the Electron binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/electron
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            electron-${{ runner.os }}-

      - name: Install dependencies
        env:
          NODE_ENV: development
        run: npm ci --include=dev

      - name: Verify
        run: npm run verify

      - name: Install xvfb and Electron runtime libraries
        run: |
          sudo apt-get update
          for pkg in xvfb libgbm1 libasound2t64 libasound2; do
            sudo apt-get install -y "$pkg" || true
          done

      - name: End-to-end tests
        run: xvfb-run --auto-servernum npx playwright test

  build:
    name: build (${{ matrix.artifact }})
    needs: gate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # electron-builder is configured with `electronDist`, which packages
          # the Electron distribution installed on the runner. That only works
          # on a matching platform, so each artifact is built on its own OS.
          - os: windows-latest
            target: win
            artifact: windows
          - os: ubuntu-latest
            target: linux
            artifact: linux
          # One job per architecture: `electronDist` packages the Electron
          # distribution installed on the runner, and that is a single
          # architecture. Universal binaries would need both distributions
          # merged, which electron-builder cannot do from one `electronDist`.
          # `macos-latest` is arm64; `macos-15-intel` is the x64 label.
          - os: macos-latest
            target: mac:arm64
            artifact: mac-arm64
          - os: macos-15-intel
            target: mac:x64
            artifact: mac-x64

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        env:
          NODE_ENV: development
        run: npm ci --include=dev

      # The Castlabs ECS build downloads its Electron binary lazily on first
      # launch, not during `postinstall`. electron-builder then packages
      # `node_modules/electron/dist`, so without this step that path does not
      # exist and packaging fails with "The specified electronDist does not
      # exist". Resolving the module path is enough to trigger the download
      # without starting a window.
      - name: Download the Electron binary
        run: node -e "console.log(require('electron'))"

      - name: Verify the Electron binary is present
        shell: bash
        run: |
          if [ ! -d node_modules/electron/dist ]; then
            echo "node_modules/electron/dist is missing after the download step"
            exit 1
          fi
          ls -1 node_modules/electron/dist | head -20

      # The version in the installer comes from the tag, so a release can never
      # be built from a commit whose package.json disagrees with the tag. This
      # edits package.json in the runner only; nothing is committed.
      - name: Align package version with the tag
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      # `--publish never` is in the npm script. Without it electron-builder
      # detects the GitHub remote and tries to publish the release itself, which
      # fails on a runner with no token — and would compete with the dedicated
      # publish job below. Building and publishing are kept separate on purpose.
      - name: Build ${{ matrix.artifact }} installer
        run: npm run dist:${{ matrix.target }}

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: installer-${{ matrix.artifact }}
          path: |
            release/*.exe
            release/*.blockmap
            release/*.AppImage
            release/*.dmg
            release/latest*.yml
          if-no-files-found: error
          retention-days: 14

  publish:
    name: publish release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # Each matrix job uploads its own artifact, and both contain a `latest.yml`.
      # Merging them into one directory would let one silently overwrite the
      # other, so they are downloaded into separate subdirectories and
      # assembled deliberately below.
      - name: Download installers
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: installer-*

      - name: Assemble release assets
        run: |
          cd artifacts

          # Flatten the installers, and take the Windows feed: `latest.yml` is
          # the one this app's updater reads, while `latest-linux.yml` belongs to
          # the Linux AppImage updater.
          #
          # No `latest-mac.yml` is taken: the two macOS jobs each produce one, and
          # macOS builds do not self-update (an ad-hoc signature fails Squirrel's
          # signature check), so publishing either would advertise an update that
          # cannot install.
          find . -mindepth 2 -type f -name '*.exe' -exec mv -f {} . \;
          find . -mindepth 2 -type f -name '*.AppImage' -exec mv -f {} . \;
          find . -mindepth 2 -type f -name '*.dmg' -exec mv -f {} . \;
          find . -mindepth 2 -type f -name 'latest.yml' -exec mv -f {} . \;
          find . -mindepth 2 -type f -name 'latest-linux.yml' -exec mv -f {} . \;
          find . -mindepth 2 -type f -name '*.blockmap' -exec mv -f {} . \;
          find . -mindepth 2 -type f -name 'latest-mac.yml' -delete
          find . -mindepth 1 -type d -empty -delete
          find . -mindepth 1 -type d -exec rm -rf {} +
          find . -maxdepth 1 -type f -name 'builder-debug.yml' -delete

          # Checksum only the user-facing downloads; the update feed and its
          # blockmap are consumed by electron-updater, not by people.
          sha256sum ./*.exe ./*.AppImage ./*.dmg > SHA256SUMS.txt

          echo "--- published assets ---"
          ls -lh

      # The changelog in the repository is the source of truth. This pulls the
      # section for the tag being released, so the Release page and CHANGELOG.md
      # cannot drift apart.
      - name: Extract changelog entry
        run: node scripts/changelog-section.mjs "${{ github.ref_name }}"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          {
            cat changelog-section.md
            cat <<'NOTES'

          ---

          ## Installers

          These builds are **not code signed by a paid certificate**. Windows
          SmartScreen will warn on first run. macOS builds are **ad-hoc signed**,
          which is enough to launch: macOS will say the developer cannot be
          verified, not that the app is damaged.

          **An active JioHotstar account is required.** This app is a native shell
          around the official web player. It contains no content and does not
          bypass DRM.

          ### macOS

          Pick the DMG for your Mac: `arm64` for Apple Silicon (M1 and later),
          `x64` for Intel. On first launch, macOS blocks the app; allow it in
          **System Settings → Privacy & Security → Open Anyway**, or clear the
          quarantine flag:

          ```bash
          xattr -cr /Applications/JioHotstar.app
          ```

          **macOS builds do not update themselves.** The in-app updater is disabled
          there, because an ad-hoc signature cannot satisfy the signature check
          that the macOS updater performs on a downloaded update. Download each new
          version from this releases page.

          ### Verifying the download

          Each file is built from this tag by GitHub Actions. Check it against
          `SHA256SUMS.txt`:

          ```bash
          sha256sum -c SHA256SUMS.txt
          ```

          On Windows, compare with `Get-FileHash <file> -Algorithm SHA256`.
          On macOS, use `shasum -a 256 <file>`.
          NOTES
          } > release-notes.md

          gh release create "$TAG" \
            --title "JioHotstar Desktop $TAG" \
            --notes-file release-notes.md \
            artifacts/*

      - name: Release summary
        run: |
          echo "### Release ${{ github.ref_name }} published" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| File | Size |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | --- |" >> "$GITHUB_STEP_SUMMARY"
          cd artifacts
          for f in *; do
            echo "| $f | $(du -h "$f" | cut -f1) |" >> "$GITHUB_STEP_SUMMARY"
          done
