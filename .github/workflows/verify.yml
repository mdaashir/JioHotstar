name: verify

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is included deliberately: line-ending problems and anything
        # path-related only appear there, and the artifact most users install is
        # a Windows installer.
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # NODE_ENV is pinned because npm omits devDependencies when it is set to
      # production, which would drop Electron and the entire toolchain. The
      # explicit flag is a second guard on top of that.
      - name: Install dependencies
        env:
          NODE_ENV: development
        run: npm ci --include=dev

      # Format, lint, type-check, unit test, build. Deliberately does not launch
      # the app, so it needs no display and no Electron binary download.
      - name: Verify
        run: npm run verify

      - name: Report failure guidance
        if: failure()
        shell: bash
        run: |
          echo "One of format, lint, type-check, unit tests, or build failed."
          echo "Reproduce locally with: npm run verify"
          echo "If only formatting failed on Windows, it is line endings:"
          echo "  git config core.autocrlf false"
