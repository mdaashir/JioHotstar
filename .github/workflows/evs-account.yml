name: evs-account

# One-off helper for creating the castlabs EVS account that production-signs the
# Widevine CDM (VMP). Run manually from the Actions tab — it is not part of CI.
#
# Flow, in order:
#   1. help    — prints the CLI flags. No credentials needed.
#   2. signup  — creates the account. Castlabs emails a confirmation code.
#   3. confirm — completes signup with that code.
#
# After that, set EVS_ACCOUNT_NAME and EVS_PASSWD as repository secrets and the
# release workflow will VMP-sign the packaged app.
#
# Signing is free but the account is not disposable: castlabs ask that nobody
# creates throwaway accounts and that builds are not re-signed when an existing
# signature is still valid. One account, reused.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'help | signup | confirm'
        required: true
        default: 'help'
      code:
        description: 'Email confirmation code (confirm mode only)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  evs:
    name: evs (${{ inputs.mode }})
    runs-on: ubuntu-latest

    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install the EVS client
        run: python -m pip install --upgrade castlabs-evs

      - name: Show CLI help
        if: inputs.mode == 'help'
        run: |
          echo "===== account ====="
          python -m castlabs_evs.account --help || true
          echo "===== signup ====="
          python -m castlabs_evs.account signup --help || true
          echo "===== confirm-signup ====="
          python -m castlabs_evs.account confirm-signup --help || true

      # Exits non-zero only on real failure. Castlabs' own errors are printed
      # verbatim so a wrong flag is obvious rather than swallowed.
      - name: Create the account
        if: inputs.mode == 'signup'
        env:
          EVS_ACCOUNT_NAME: ${{ secrets.EVS_ACCOUNT_NAME }}
          EVS_PASSWD: ${{ secrets.EVS_PASSWD }}
          EVS_EMAIL: ${{ secrets.EVS_EMAIL }}
        run: |
          for var in EVS_ACCOUNT_NAME EVS_PASSWD EVS_EMAIL; do
            if [ -z "${!var}" ]; then
              echo "::error::$var is not set. Add it as a repository secret first."
              exit 1
            fi
            echo "$var: present (length ${#var})"
          done

          python -m castlabs_evs.account -n signup \
            -A "$EVS_ACCOUNT_NAME" \
            -P "$EVS_PASSWD" \
            -E "$EVS_EMAIL" \
            -F "JioHotstar" \
            -L "Desktop" \
            -O "JioHotstar Desktop"

          echo
          echo "If that succeeded, a confirmation code is now in the account inbox."
          echo "Re-run this workflow with mode=confirm and that code."

      - name: Confirm the account
        if: inputs.mode == 'confirm'
        env:
          EVS_ACCOUNT_NAME: ${{ secrets.EVS_ACCOUNT_NAME }}
          EVS_PASSWD: ${{ secrets.EVS_PASSWD }}
        run: |
          if [ -z "${{ inputs.code }}" ]; then
            echo "::error::Pass the confirmation code in the 'code' input."
            exit 1
          fi

          python -m castlabs_evs.account -n confirm-signup \
            -A "$EVS_ACCOUNT_NAME" \
            -P "$EVS_PASSWD" \
            -C "${{ inputs.code }}"

          echo
          echo "Account confirmed. Re-run a release to VMP-sign the build."

      # Proves the stored credentials still work without signing anything. Worth
      # running if a release ever reports a VMP failure.
      - name: Verify credentials
        if: inputs.mode == 'help'
        env:
          EVS_ACCOUNT_NAME: ${{ secrets.EVS_ACCOUNT_NAME }}
          EVS_PASSWD: ${{ secrets.EVS_PASSWD }}
        run: |
          if [ -z "$EVS_ACCOUNT_NAME" ] || [ -z "$EVS_PASSWD" ]; then
            echo "Credentials not set yet — nothing to verify."
            exit 0
          fi
          python -m castlabs_evs.account -n reauth \
            -A "$EVS_ACCOUNT_NAME" -P "$EVS_PASSWD"
