name: ci

# Runs on every pull request and on every push to main, including direct
# commits. Both jobs gate a change: verify proves it compiles and behaves at the
# unit level, e2e proves the real app still launches and plays.
on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is included deliberately: line-ending problems and anything
        # path-related only appear there, and the artifact most users install is
        # a Windows installer.
        #
        # macOS is included because it ships now. Before this, the only macOS
        # verification was inside release.yml, which runs on a tag — so a macOS
        # regression was first discovered after a release was already cut. This
        # job is also what catches a macOS-specific break in `npm run verify`
        # (case-sensitive paths, platform-conditional code) on the pull request
        # that introduced it.
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # NODE_ENV is pinned because npm omits devDependencies when it is set to
      # production, which would drop Electron and the entire toolchain. The
      # explicit flag is a second guard on top of that.
      - name: Install dependencies
        env:
          NODE_ENV: development
        run: npm ci --include=dev

      # Format, lint, type-check, unit test, build. Does not launch the app, so
      # it needs no display and no Electron binary download.
      - name: Verify
        run: npm run verify

      - name: Report failure guidance
        if: failure()
        shell: bash
        run: |
          echo "One of format, lint, type-check, unit tests, or build failed."
          echo "Reproduce locally with: npm run verify"
          echo "If only formatting failed on Windows, it is line endings:"
          echo "  git config core.autocrlf false"

  # `verify` never runs electron-builder, so a broken packaging config — a bad
  # `electron-builder.yml` key, a missing entitlement, an icon the target cannot
  # use — would first be discovered by the release workflow, with a tag already
  # pushed. This job runs the exact command the release runs, minus publishing.
  #
  # macOS only, not all three: it is the platform with no other packaging check,
  # it is where signing runs (ad-hoc, so it exercises `identity: "-"` and the
  # entitlements), and hdiutil makes DMG creation the most failure-prone target.
  # Windows and Linux have been packaged successfully on every release so far.
  package:
    name: package (macos)
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Cache the Electron binary
        uses: actions/cache@v6
        with:
          path: ~/Library/Caches/electron
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            electron-${{ runner.os }}-

      - name: Install dependencies
        env:
          NODE_ENV: development
        run: npm ci --include=dev

      # Same requirement as the release workflow: ECS downloads its Electron
      # binary lazily on first launch, so `electronDist` does not exist until
      # something resolves the module. Requiring it is enough.
      - name: Download the Electron binary
        run: node -e "console.log(require('electron'))"

      - name: Verify the Electron binary is present
        run: |
          test -d node_modules/electron/dist || {
            echo "node_modules/electron/dist is missing after the download step"
            exit 1
          }

      - name: Build the macOS dmg
        # electron-builder skips ALL macOS signing on a pull_request event:
        # `isPullRequest()` sees GITHUB_BASE_REF and `isSignAllowed()` returns
        # false, leaving only the linker's own signature — which is the
        # "damaged and can't be opened" state this job exists to catch. The
        # escape hatch exists for the opposite reason (not leaking a real
        # certificate to forks), and there is no certificate here: signing is
        # ad-hoc (`mac.identity: "-"`), so forcing it exposes nothing.
        env:
          CSC_FOR_PULL_REQUEST: 'true'
        run: npm run dist:mac:arm64

      - name: Check the app bundle was signed
        run: |
          APP=$(find release -maxdepth 2 -name 'JioHotstar.app' -print -quit)
          test -n "$APP" || { echo "no JioHotstar.app produced under release/"; ls -R release | head -40; exit 1; }
          echo "app bundle: $APP"

          # Ad-hoc signing is the configured behaviour and the difference between
          # launching and "damaged and can't be opened", so assert it directly.
          codesign --display --verbose=2 "$APP" 2>&1 | tee codesign.txt
          grep -q 'Signature=adhoc' codesign.txt || {
            echo "expected an ad-hoc signature (mac.identity: \"-\")"
            exit 1
          }

          # Structural check of the bundle itself. `--deep` is deliberately not
          # used: it is deprecated and reports false failures on Electron's nested
          # frameworks, which would make this job flaky rather than useful.
          codesign --verify --strict "$APP"
          echo "ad-hoc signature present and bundle verifies"

      - name: Check the dmg exists
        run: |
          ls -lh release/*.dmg
          test -n "$(find release -maxdepth 1 -name '*.dmg' -print -quit)"

      - name: Upload the dmg on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: macos-packaging-failure
          path: |
            release/*.dmg
            release/builder-debug.yml
            release/*.log
          retention-days: 7
          if-no-files-found: ignore

  e2e:
    name: e2e (ubuntu)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # The ECS Electron binary is a ~160 MB download fetched lazily on first
      # launch, not by postinstall. Caching it turns a cold run into a warm one.
      - name: Cache the Electron binary
        uses: actions/cache@v6
        with:
          path: ~/.cache/electron
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            electron-${{ runner.os }}-

      - name: Install dependencies
        env:
          NODE_ENV: development
        run: npm ci --include=dev

      - name: Install xvfb and Electron runtime libraries
        # Package names for the ALSA/GBM libraries changed in Ubuntu 24.04
        # (libasound2 -> libasound2t64), so install whichever exists rather than
        # pinning a name that breaks on the next runner image.
        run: |
          sudo apt-get update
          for pkg in xvfb libgbm1 libasound2t64 libasound2; do
            sudo apt-get install -y "$pkg" || true
          done

      - name: Build
        run: npm run build

      - name: Run end-to-end tests
        run: xvfb-run --auto-servernum npx playwright test

      - name: Upload failure artefacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
