# The end-to-end suite launches the real app, which downloads the Widevine CDM
# and loads the live JioHotstar site. It therefore needs a display server and
# network access, so it does not run on every pull request — a suite that fails
# for reasons unrelated to the change trains people to ignore it.
#
# It runs on demand and nightly instead.
name: e2e

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: e2e (ubuntu)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The ECS Electron binary is a ~160 MB download fetched on first launch,
      # not by postinstall. Caching it turns a cold run into a warm one.
      - name: Cache the Electron binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/electron
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            electron-${{ runner.os }}-

      - name: Install dependencies
        env:
          NODE_ENV: development
        run: npm ci --include=dev

      - name: Install xvfb and Electron runtime libraries
        # Package names for the ALSA/GBM libraries changed in Ubuntu 24.04
        # (libasound2 -> libasound2t64), so install whichever exists rather than
        # pinning a name that will break on the next runner image.
        run: |
          sudo apt-get update
          for pkg in xvfb libgbm1 libasound2t64 libasound2; do
            sudo apt-get install -y "$pkg" || true
          done

      - name: Build
        run: npm run build

      - name: Run end-to-end tests
        run: xvfb-run --auto-servernum npx playwright test

      - name: Upload failure artefacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
