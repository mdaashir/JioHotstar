appId: com.jiohotstar.desktop
productName: JioHotstar
copyright: Copyright © 2026

directories:
  output: release
  buildResources: build

electronDist: node_modules/electron/dist
electronVersion: 45.2.1

asar: true
npmRebuild: false

files:
  - out/**
  - package.json
  - '!**/*.map'

extraResources:
  - from: resources/icon.png
    to: icon.png
  - from: resources/tray-icon.png
    to: tray-icon.png

win:
  icon: build/icon.png
  target:
    - target: nsis
      arch:
        - x64

nsis:
  installerIcon: build/icon.png
  uninstallerIcon: build/icon.png
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true

mac:
  icon: build/icon.png
  target:
    - target: dmg
      arch:
        - arm64
        - x64
  category: public.app-category.entertainment
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist

linux:
  icon: build/icon.png
  target:
    - target: AppImage
      arch:
        - x64
  category: AudioVideo
