appId: com.jiohotstar.desktop
productName: JioHotstar
copyright: Copyright © 2026 mdaashir

# The updater reads this feed. Assets are attached by the release workflow,
# which runs electron-builder with --publish never and creates the Release with
# `gh`; this block only tells the packaged app where to look.
publish:
  provider: github
  owner: mdaashir
  repo: JioHotstar

directories:
  output: release
  buildResources: build

electronDist: node_modules/electron/dist
electronVersion: 45.2.1

asar: true
npmRebuild: false

# Widevine VMP signing, free through castlabs EVS. Two hooks, because the required
# order differs per platform:
#
#   macOS:  afterPack  — VMP must precede the code signature, since VMP rewrites
#                        the binary and would destroy a signature already applied.
#   Windows: afterSign — electron-builder writes the icon and version strings into
#                        the exe after `afterPack`, and that invalidates a VMP
#                        signature made there. Measured: the exe ended up 3 seconds
#                        newer than the .sig and `evs-vmp verify-pkg` said
#                        InvalidSignature. afterSign runs once the exe is final.
#
# Both are no-ops without EVS credentials, so local builds and forks are unaffected.
afterPack: scripts/vmp-after-pack.cjs
afterSign: scripts/vmp-after-sign.cjs

files:
  - out/**
  - package.json
  - '!**/*.map'

extraResources:
  - from: resources/icon.png
    to: icon.png
  - from: resources/tray-icon.png
    to: tray-icon.png

win:
  icon: build/icon.png
  target:
    - target: nsis
      arch:
        - x64

nsis:
  # NSIS needs a real .ico; pointing it at the PNG fails with "invalid icon file".
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  # A hyphenated name with no spaces is required for auto-update. electron-updater
  # rewrites spaces to hyphens when building the download URL
  # (`url.replace(/ /g, "-")`), while GitHub rewrites spaces to dots on upload.
  # The default "JioHotstar Setup 1.2.3.exe" therefore resolves to
  # JioHotstar-Setup-1.2.3.exe and 404s. A name that survives both rewrites
  # unchanged cannot break.
  artifactName: JioHotstar-Setup-${version}.${ext}
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true

mac:
  icon: build/icon.png
  # No arch list: each CI job builds one architecture from the Electron
  # distribution installed on that runner, because `electronDist` below pins a
  # single architecture. The arch is chosen by `--arm64` / `--x64` instead.
  target:
    - target: dmg
  # Two DMGs are published per release, so the architecture must be in the name.
  # Hyphenated for the same reason as the other platforms.
  artifactName: JioHotstar-${version}-${arch}.${ext}
  category: public.app-category.entertainment
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # Ad-hoc signing, and it is not optional. An unsigned bundle is reported as
  # "damaged and can't be opened" on Apple Silicon, which the user cannot bypass;
  # an ad-hoc signature is merely "unidentified developer", which they can.
  # `"-"` invokes the real signing pipeline with a self-generated identity; using
  # `null` here skips signing and produces the unopenable bundle.
  identity: '-'

linux:
  icon: build/icon.png
  # Same reasoning as the NSIS artifact name: no spaces, so the updater's
  # space-to-hyphen rewrite is a no-op.
  artifactName: JioHotstar-${version}.${ext}
  target:
    - target: AppImage
      arch:
        - x64
  category: AudioVideo
